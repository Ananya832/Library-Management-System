<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Issued Books</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        
        h1 {
            color: #1976d2;
            margin-top: 30px;
        }
        
        h3 {
            margin: 10px 0;
            color: #333;
        }
        
        .home-link {
            position: fixed;
            top: 10px;
            left: 20px;
            background-color: #1976d2;
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        
        .home-link:hover {
            background-color: #1565c0;
        }
        
        .home-link:active {
            background-color: #0d47a1;
        }
        
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            margin-top: 60px;
        }
        
        label {
            font-weight: bold;
            color: #555;
        }
        
        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        
        input:focus,
        select:focus {
            border-color: #1976d2;
            outline: none;
            box-shadow: 0 0 5px rgba(25, 118, 210, 0.5);
        }
        
        button {
            background-color: #1976d2;
            color: white;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #1565c0;
        }
        
        button:active {
            background-color: #0d47a1;
        }
        
        table {
            width: 90%;
            margin-top: 20px;
            border-collapse: collapse;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        th,
        td {
            padding: 12px;
            text-align: center;
        }
        
        th {
            background-color: #1976d2;
            color: white;
        }
        
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        tr:hover {
            background-color: #f1f1f1;
        }
        
        td button {
            padding: 6px 12px;
            background-color: #f44336;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        
        td button:hover {
            background-color: #d32f2f;
        }
        
        td button:active {
            background-color: #c62828;
        }
    </style>
</head>

<body>
    <a class="home-link" href="index.html">🏠 Home</a>

    <h1>Issued Books</h1>

    <div class="form-container">
        <h3>Issue a New Book</h3>
        <div>
            <label for="usnInput">Student USN:</label>
            <input type="text" id="usnInput" placeholder="Enter USN">

            <label for="bookSelect">Select Book:</label>
            <select id="bookSelect">
                <option value="">--Select--</option>
            </select>

            <label for="dueDate">Due Date:</label>
            <input type="date" id="dueDate" placeholder="dd-mm-yyyy">

            <button onclick="issueBook()">Issue</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>USN</th>
                <th>Name</th>
                <th>Book Title</th>
                <th>Issue Date</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Fine (₹)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="issuedTable"></tbody>
    </table>

    <script>
        let issuedBooks = JSON.parse(localStorage.getItem("issuedBooks") || "[]");
        let books = JSON.parse(localStorage.getItem("books") || "[]");
        let students = JSON.parse(localStorage.getItem("members") || "[]");

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const day = String(date.getDate()).padStart(2, "0");
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function renderIssuedTable(filtered = issuedBooks) {
            const table = document.getElementById("issuedTable");
            table.innerHTML = "";

            filtered.forEach((entry, index) => {
                const today = new Date();
                const due = new Date(entry.dueDate);
                const diff = Math.floor((today - due) / (1000 * 60 * 60 * 24));
                const fine = diff > 0 ? diff * 10 : 0;
                const status = diff < 0 ? "On Time" : diff === 0 ? "Time Up" : "Overtime";

                const student = students.find(s => s.usn === entry.usn);
                const name = student ? student.name : "Unknown";

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${entry.usn}</td>
                    <td>${name}</td>
                    <td>${entry.book}</td>
                    <td>${formatDate(entry.issueDate)}</td>
                    <td>${formatDate(entry.dueDate)}</td>
                    <td>${status}</td>
                    <td>${fine}</td>
                    <td><button onclick="returnBook(${index})">Return</button></td>
                `;
                table.appendChild(row);
            });
        }

        function returnBook(index) {
            const title = issuedBooks[index].book;
            const bookIndex = books.findIndex(b => b.title === title);
            if (bookIndex !== -1) {
                books[bookIndex].copies++;
                localStorage.setItem("books", JSON.stringify(books));
            }
            issuedBooks.splice(index, 1);
            localStorage.setItem("issuedBooks", JSON.stringify(issuedBooks));
            renderIssuedTable();
            populateBookDropdown();
        }

        function issueBook() {
            const usn = document.getElementById("usnInput").value.trim();
            const bookTitle = document.getElementById("bookSelect").value;
            const dueDate = document.getElementById("dueDate").value;

            if (!usn || !bookTitle || !dueDate) {
                alert("Please enter all fields.");
                return;
            }

            const student = students.find(s => s.usn === usn);
            if (!student) {
                alert("Student not registered!");
                return;
            }

            const book = books.find(b => b.title === bookTitle);
            if (!book || book.copies <= 0) {
                alert("Book not available!");
                return;
            }

            book.copies--;
            localStorage.setItem("books", JSON.stringify(books));

            const today = new Date();
            const issueDate = today.toISOString().split("T")[0]; // store in yyyy-mm-dd

            issuedBooks.push({
                usn: usn,
                book: bookTitle,
                issueDate: issueDate,
                dueDate: dueDate
            });

            localStorage.setItem("issuedBooks", JSON.stringify(issuedBooks));
            renderIssuedTable();
            populateBookDropdown();

            document.getElementById("usnInput").value = "";
            document.getElementById("bookSelect").value = "";
            document.getElementById("dueDate").value = "";
        }

        function populateBookDropdown() {
            const select = document.getElementById("bookSelect");
            select.innerHTML = `<option value="">--Select--</option>`;
            books.forEach(book => {
                if (book.copies > 0) {
                    const bookID = book.bookID ? `${book.bookID} - ` : "";
                    const option = document.createElement("option");
                    option.value = book.title;
                    option.textContent = `${bookID}${book.title}`;
                    select.appendChild(option);
                }
            });
        }

        window.onload = () => {
            populateBookDropdown();
            renderIssuedTable();
        };
    </script>
</body>

</html>
